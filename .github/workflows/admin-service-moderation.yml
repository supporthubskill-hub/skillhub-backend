name: Add admin service moderation
on:
  push:
    branches: [chatgpt/admin-service-moderation]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/admin-service-moderation
      - name: Update backend
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('server.js')
          t=p.read_text()
          anchor="app.get('/api/admin/users', auth, allow('admin'), async (req, res, next) => {"
          block="""app.get('/api/admin/services', auth, allow('admin'), async (req, res, next) => {\n  try {\n    const q = String(req.query.q || '').trim().slice(0,100);\n    const pattern = `%${q}%`;\n    const { rows } = await pool.query(`SELECT s.id,s.name,s.category,s.area,s.active,s.created_at AS \"createdAt\",\n      u.id AS \"providerId\",u.name AS \"providerName\",u.email AS \"providerEmail\",\n      (SELECT COUNT(*)::int FROM bookings b WHERE b.service_id=s.id) AS \"bookingCount\"\n      FROM services s JOIN users u ON u.id=s.provider_id\n      WHERE ($1='' OR s.name ILIKE $2 OR u.name ILIKE $2 OR u.email ILIKE $2)\n      ORDER BY s.created_at DESC LIMIT 300`, [q, pattern]);\n    res.json(rows);\n  } catch (e) { next(e); }\n});\n\napp.delete('/api/admin/services/:id', auth, allow('admin'), async (req, res, next) => {\n  try {\n    const { rows } = await pool.query(`UPDATE services SET active=FALSE WHERE id=$1 AND active=TRUE\n      RETURNING id,name,provider_id AS \"providerId\",active`, [req.params.id]);\n    if (!rows[0]) return res.status(404).json({ error: 'Servicio no encontrado o ya eliminado' });\n    await pool.query('UPDATE availability SET available=FALSE WHERE service_id=$1 AND available=TRUE', [req.params.id]);\n    res.json({ ...rows[0], removed: true });\n  } catch (e) { next(e); }\n});\n\n"""
          if '/api/admin/services' not in t:
              if anchor not in t: raise SystemExit('anchor not found')
              t=t.replace(anchor,block+anchor)
              p.write_text(t)
          PY
      - name: Commit
        run: |
          rm .github/workflows/admin-service-moderation.yml
          rm -f dummy
          git config user.name "SkillHub Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Add admin service moderation"
          git push origin HEAD:chatgpt/admin-service-moderation
