name: Admin transaction hardening

on:
  push:
    branches:
      - chatgpt/admin-improvements-batch

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/admin-improvements-batch
      - name: Patch backend
        run: python scripts/harden_admin_transactions.py
      - name: Validate syntax
        run: node --check server.js
      - name: Commit backend changes
        run: |
          git config user.name "SkillHub Automation"
          git config user.email "actions@users.noreply.github.com"
          git add server.js
          git commit -m "Harden admin moderation transactions"
          git push origin HEAD:chatgpt/admin-improvements-batch
