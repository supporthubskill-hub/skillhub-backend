name: Apply Resend email delivery
on:
  push:
    branches: [chatgpt/resend-email-delivery]
    paths: [.github/workflows/apply-resend-email.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Replace SMTP-only delivery with Resend API first
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('server.js')
          text = path.read_text()
          old = r'''function createMailTransport\(\) \{.*?\n\}\n\nasync function sendVerificationMail\(email, code\) \{.*?\n\}\n'''
          new = '''function createMailTransport() {
  const user = String(process.env.SMTP_USER || '').trim();
  const pass = String(process.env.SMTP_PASS || '').trim();
  if (!user || !pass) throw new Error('Email verification is not configured');
  return nodemailer.createTransport({
    host: process.env.SMTP_HOST || 'smtp.gmail.com',
    port: Number(process.env.SMTP_PORT || 587),
    secure: String(process.env.SMTP_SECURE || 'false').toLowerCase() === 'true',
    auth: { user, pass },
    connectionTimeout: 10000,
    greetingTimeout: 10000,
    socketTimeout: 15000
  });
}

async function sendVerificationMail(email, code) {
  const subject = 'Tu código de verificación de SkillHub';
  const text = `Tu código de verificación de SkillHub es ${code}. Expira en 10 minutos. Si no solicitaste este código, ignora este correo.`;
  const html = `<div style="font-family:Arial,sans-serif;max-width:520px;margin:auto;padding:24px"><h2>Verifica tu correo en SkillHub</h2><p>Usa este código para confirmar tu correo:</p><div style="font-size:32px;font-weight:700;letter-spacing:8px;margin:24px 0">${code}</div><p>El código expira en 10 minutos.</p><p style="color:#64748b;font-size:13px">Si no solicitaste este código, puedes ignorar este mensaje.</p></div>`;
  const resendKey = String(process.env.RESEND_API_KEY || '').trim();

  if (resendKey) {
    const from = String(process.env.RESEND_FROM || process.env.EMAIL_FROM || '').trim();
    if (!from) throw new Error('RESEND_FROM is required when Resend is enabled');
    const response = await fetch('https://api.resend.com/emails', {
      method: 'POST',
      headers: {
        'Authorization': `Bearer ${resendKey}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ from, to: [email], subject, text, html }),
      signal: AbortSignal.timeout(12000)
    });
    if (!response.ok) {
      const detail = await response.json().catch(() => ({}));
      const safeMessage = String(detail?.message || 'Resend rejected the email').slice(0, 180);
      throw new Error(`Email provider error: ${safeMessage}`);
    }
    return;
  }

  const transporter = createMailTransport();
  const from = process.env.EMAIL_FROM || `SkillHub <${process.env.SMTP_USER}>`;
  await transporter.sendMail({ from, to: email, subject, text, html });
}
'''
          updated, count = re.subn(old, new, text, count=1, flags=re.S)
          if count != 1:
            raise SystemExit('Email delivery block not found exactly once')
          path.write_text(updated)
      - name: Update environment example
        shell: python
        run: |
          from pathlib import Path
          p=Path('.env.example')
          text=p.read_text()
          marker='''\n# Email verification via Resend API (preferred on Render)\nRESEND_API_KEY=\nRESEND_FROM=SkillHub <onboarding@resend.dev>\n'''
          if 'RESEND_API_KEY=' not in text:
            text += marker
          p.write_text(text)
      - name: Validate backend syntax
        run: node --check server.js
      - name: Commit implementation and remove helper workflow
        run: |
          rm .github/workflows/apply-resend-email.yml
          git config user.name "supporthubskill-hub"
          git config user.email "support.hubskill@gmail.com"
          git add server.js .env.example .github/workflows/apply-resend-email.yml
          git commit -m "Use Resend API for verification emails"
          git push
