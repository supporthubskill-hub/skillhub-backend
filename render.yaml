services:
  - type: web
    name: skillhub-backend
    runtime: docker
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: skillhub-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://skillhub-frontend2.vercel.app
databases:
  - name: skillhub-db
    plan: free
